<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina inicial</title>
    <link rel="stylesheet" href="../css/semlogin.css">
</head>
<body>
    <header>
        <div class="saldo">
                <span>Saldo atual</span>
                <h2 id="saldo">R$ 0,00</h2>
        </div>
        <a href="../login/login.html" class="botao_entrar">Entrar</a>
    </header>

    <section class="movimentacoes">
         <h2>Movimentações financeiras</h2>

         <div class="filtros">

            <select id="tipo">
                <option value="todos">Todos</option>
                <option value="credito">Créditos</option>
                <option value="debito">Débitos</option>
            </select>

            <div class="filtro-periodo">
                <label for="data_inicio">De:</label>
                <input type="date" id="data_inicio">

                <label for="data_fim">Até:</label>
                <input type="date" id="data_fim">
            </div>

            <button id="botao_filtrar">Filtrar</button>

        </div>


    <table>
        <thead>
            <tr>
                <th>Data</th>
                <th>Descrição</th>
                <th>Categoria</th>
                <th>Valor</th>
            </tr>
        </thead>

        <tbody id="tabela-movimentacoes">
            <!--colocar tabela depois -->
        </tbody>

    </table>

    </section>
</body>
</html>
